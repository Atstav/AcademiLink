<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AcademiLink Web</title>

    <link rel="stylesheet" href="/css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

</head>

<body>

    <header>
        <h1>AcademiLink</h1>
        <p>Student Social Network</p>
    </header>

    <main>
        <section>
            <h2>Users</h2>

            <button id="loadUsersBtn">
                Load Users
            </button>

            <div id="usersList"></div>
        </section>

        <section>
            <h2>Study Groups</h2>

            <button id="loadGroupsBtn">
                Load Groups
            </button>

            <div id="groupsList"></div>
        </section>

        <section>
            <h2>Posts</h2>

            <button id="loadPostsBtn">
                Load Posts
            </button>

            <div id="postsList"></div>
        </section>

        <section>
            <h2>Statistics</h2>

            <button id="loadChartsBtn">
                Load Charts
            </button>

            <h3>Users by Study Year</h3>
            <div id="usersChart"></div>

            <h3>Posts by Category</h3>
            <div id="postsChart"></div>
        </section>

        <section>
            <h2>React Media Demo</h2>

            <div id="reactRoot"></div>
        </section>

    </main>

    <script src="/js/app.js"></script>

    <script src="/js/reactApp.js"></script>

</body>
</html>
